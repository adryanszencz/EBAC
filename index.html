<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="avatar" src="https://placehold.co/180x180" alt="Foto de perfil">
            <h1 class="profile-name" id="nome">Carregando...</h1>
            <h2 class="profile-username" id="usuario"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repositorios">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="seguidores">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="seguindo">0</span>
                </li>
            </ul>
            <a href="#" class="profile-link" id="link" target="_blank" rel="noopener">Ver no Github</a>
            <p class="profile-error" id="erro" hidden></p>
        </div>
    </header>
    <script src="main.js"></script>
</body>
</html>
